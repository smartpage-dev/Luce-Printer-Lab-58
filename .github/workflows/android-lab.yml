name: Printer Lab Android APK

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: 'I accept the Android SDK licenses for this build'
        type: boolean
        required: true
        default: false
      signing_mode:
        description: 'Temporary for first trial; persistent-test to keep update compatibility'
        type: choice
        required: true
        default: temporary-test
        options:
          - temporary-test
          - persistent-test

permissions:
  contents: read
concurrency:
  group: printer-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare logs and enforce explicit SDK license acceptance
        env:
          ACCEPT_LICENSES: ${{ inputs.accept_android_sdk_licenses }}
        run: |
          mkdir -p ci-output
          test "$ACCEPT_LICENSES" = "true" || { echo 'SDK licenses not accepted.'; exit 1; }
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Prepare SDK and optional private test signing identity
        env:
          ACCEPT_LICENSES: ${{ inputs.accept_android_sdk_licenses }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          PRINTERLAB_TEST_KEYSTORE_BASE64: ${{ secrets.PRINTERLAB_TEST_KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          python3 tools/ci_setup.py 2>&1 | tee ci-output/setup.log
      - name: Run pure Java packet and recovery checks
        run: |
          set -o pipefail
          bash tools/run_core_tests.sh 2>&1 | tee ci-output/core-tests.log
          python3 tools/audit_source.py 2>&1 | tee ci-output/source-checks.log
          python3 tools/test_journal_sql.py 2>&1 | tee ci-output/journal-sql.log
      - name: Compile APK, run QR unit tests, and Android lint
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee ci-output/android-build.log
      - name: Verify APK and write build provenance
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: python3 tools/collect_apk.py
      - name: Downloadable test APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PrinterLab58-APK-${{ github.run_number }}-${{ inputs.signing_mode }}
          path: |
            ci-output/PrinterLab58-debug.apk
            ci-output/BUILD_INFO.json
            ci-output/SHA256SUMS.txt
            ci-output/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build diagnostics (also on failure)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PrinterLab58-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-output/*.log
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Remove runner test key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
